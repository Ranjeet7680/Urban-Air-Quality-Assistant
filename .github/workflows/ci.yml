name: Urban Air Quality Assistant CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-quality-and-security:
    name: Backend Tests, Security & Efficiency
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install Backend Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install pytest httpx

    - name: Execute Security & Unit Test Suite
      run: |
        python -m pytest tests/test_units.py -v
        python -m pytest tests/test_security.py -v
        python -m pytest tests/test_efficiency.py -v
        python -m pytest tests/test_accessibility.py -v

    - name: Execute End-to-End Test Suite
      run: |
        python tests/test_api.py

  frontend-build-and-accessibility:
    name: Frontend Build & WCAG Conformance
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Frontend Dependencies
      run: |
        cd frontend
        npm ci

    - name: TypeScript Verification & Production Build
      run: |
        cd frontend
        npm run build
