# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
version: 2
language: "en"
tone_instructions: "Be concise, constructive, and prioritize performance, security, and best practices."

reviews:
  profile: "chill" # Options: chill, assertive
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
      - "master"
      - "develop"

chat:
  auto_reply: true

tools:
  shellcheck:
    enabled: true
  eslint:
    enabled: true
  ruff:
    enabled: true
